name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build packages/types
        # Client/server import @tamari/types via its dist/*.d.ts — type-aware
        # lint and vitest fail with unresolvable error-types on a fresh checkout.
        run: npm run build --workspace=packages/types

      - name: Lint client
        run: npm run lint --workspace=client

      - name: Lint server
        run: npm run lint --workspace=server

      - name: Lint packages/types
        run: npm run lint --workspace=packages/types

      - name: Lint CSS (§16 hookable elements)
        run: npm run lint:css

      - name: Test client
        run: npm run test --workspace=client

      - name: Test server
        run: npm run test --workspace=server

  e2e:
    # Matrix over Linux + Windows. Windows runs SMOKE ONLY: journey runtime
    # roughly doubles per added OS, and the journeys' value is in the flows,
    # not in OS coverage (the smoke tier already proves build + boot + WS +
    # tool flows on Windows).
    runs-on: ${{ matrix.os }}
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install:browsers --workspace=e2e

      - name: Build app
        run: npm run build

      - name: Run E2E (smoke)
        # Fast, isolated per-feature specs — runs on every PR and push, on both OSes.
        run: npm run test:e2e:smoke

      - name: Run E2E (full, incl. journeys)
        # The long user journeys run on push (merge to main), not PRs — and on
        # Linux only: each added OS roughly doubles journey runtime. Run the
        # full suite (smoke + journeys together) rather than journeys alone:
        # the interleaving is the more stable configuration while an
        # intermittent generation-stall issue is being investigated.
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        run: npm run test:e2e
