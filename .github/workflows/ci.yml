name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint client
        run: npm run lint --workspace=client

      - name: Lint server
        run: npm run lint --workspace=server

      - name: Lint packages/types
        run: npm run lint --workspace=packages/types

      - name: Lint CSS (§16 hookable elements)
        run: npm run lint:css

      - name: Test client
        run: npm run test --workspace=client

      - name: Test server
        run: npm run test --workspace=server

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install:browsers --workspace=e2e

      - name: Build app
        run: npm run build

      - name: Run E2E (smoke)
        # Fast, isolated per-feature specs — runs on every PR and push.
        run: npm run test:e2e:smoke

      - name: Run E2E (full, incl. journeys)
        # The long user journeys run on push (merge to main), not PRs. Run the
        # full suite (smoke + journeys together) rather than journeys alone:
        # the interleaving is the more stable configuration while an
        # intermittent generation-stall issue is being investigated.
        if: github.event_name == 'push'
        run: npm run test:e2e
